server:
  port: 8080

spring:
  application:
    name: TransporteAlimentos
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/GestroContable?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjcmV0LWtleS1mb3Itam9uYXRoYW4tY2FzdHJv}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info